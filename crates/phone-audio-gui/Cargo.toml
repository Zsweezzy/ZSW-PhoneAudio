[package]
name = "ZSW-PhoneAudioGui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Phone Audio — small tray-style window to route a Bluetooth phone's audio to this PC"

# The installed program keeps its original name; only the project is rebranded.
[[bin]]
name = "phone-audio-gui"
path = "src/main.rs"

[dependencies]
phone-audio-core = { path = "../phone-audio-core", package = "ZSW-PhoneAudioCore" }
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["rt"] }