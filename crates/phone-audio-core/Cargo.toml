[package]
name = "ZSW-PhoneAudioCore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core logic for routing a Bluetooth phone's audio to this PC via PipeWire"

# The library keeps its original name; only the project is rebranded.
[lib]
name = "phone_audio_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"